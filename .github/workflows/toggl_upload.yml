name: Toggl Bulk Upload

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min so tonight's quota windows are used
  workflow_dispatch:        # allows manual trigger from GitHub UI

concurrency:
  group: toggl-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # GITHUB_TOKEN must be able to push progress to develop

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          # Do not use TOGGLE_GITHUB_TOKEN here. A fine-grained PAT without
          # Contents: Write authenticates as you, then git push returns 403.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Toggl uploader
        env:
          TOGGL_API_TOKEN: ${{ secrets.TOGGL_API_TOKEN }}
          CI: 'true'
        run: echo "Y" | python toggle_uploader.py

      - name: Save progress back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add toggl_progress.json toggl_projects_cache.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No progress files to commit"
            exit 0
          fi
          git commit -m "chore: update toggl upload progress [skip ci]"
          git push origin HEAD:develop
