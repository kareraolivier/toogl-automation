name: Toggl Bulk Upload

on:
  schedule:
    # - cron: '5 * * * *'   # once per hour; Toggl's cap is hourly, */15 only burns quota
  workflow_dispatch:        # allows manual trigger from GitHub UI

concurrency:
  group: toggl-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Toggl uploader
        env:
          TOGGL_API_TOKEN: ${{ secrets.TOGGL_API_TOKEN }}
          CI: 'true'
        run: echo "Y" | python toggle_uploader.py

      - name: Save progress back to repo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toggl_progress.json toggl_projects_cache.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No progress files to commit"
            exit 0
          fi
          git commit -m "chore: update toggl upload progress [skip ci]"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
