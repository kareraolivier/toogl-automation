name: Toggl Bulk Upload

on:
  schedule:
    # Runs every hour
    - cron: "0 * * * *"

  # Allows manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.TOGGLE_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Toggl uploader
        env:
          TOGGL_API_TOKEN: ${{ secrets.TOGGL_API_TOKEN }}
          CI: "true"
        run: |
          echo "Y" | python toggl_uploader.py

      - name: Save progress back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add toggl_progress.json toggl_projects_cache.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No progress changes to commit."
          else
            git commit -m "chore: update toggl upload progress [skip ci]"
            git push
          fi